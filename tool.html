<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Page | EduFile Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LIBRARIES FOR REAL FUNCTIONALITY -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050810; color: #e2e8f0; }
        .cyber-glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .upload-area { border: 2px dashed rgba(0, 242, 255, 0.3); transition: all 0.3s ease; }
        .upload-area:hover { border-color: #00f2ff; background: rgba(0, 242, 255, 0.05); }
        .gradient-text { background: linear-gradient(90deg, #00f2ff, #7000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite linear;
            border-radius: 8px;
        }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="cyber-glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-cyan-500/20">
        <a href="index.html" class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-cyan-400 to-blue-600 p-2 rounded-xl">
                <i class="fas fa-bolt text-white text-sm"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter">EduFile <span class="gradient-text">Ultra</span></span>
        </a>
        <a href="index.html" class="text-slate-400 hover:text-white transition text-sm font-medium">
            <i class="fas fa-arrow-left mr-2"></i> Back to Hub
        </a>
    </nav>

    <main class="flex-1 max-w-4xl mx-auto w-full px-6 py-16">
        <div class="text-center mb-12" id="header-section">
            <div id="skeleton-header">
                <div class="h-10 w-64 skeleton mx-auto mb-4"></div>
                <div class="h-4 w-full max-w-md skeleton mx-auto"></div>
            </div>
            <div id="actual-header" class="hidden">
                <h1 id="tool-title" class="text-4xl font-extrabold mb-4"></h1>
                <p id="tool-desc" class="text-slate-400"></p>
            </div>
        </div>

        <div class="cyber-glass p-8 rounded-3xl shadow-2xl">
            <div id="drop-zone" class="upload-area rounded-2xl p-12 text-center cursor-pointer">
                <div class="w-20 h-20 bg-cyan-500/10 text-cyan-500 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-cloud-upload-alt text-4xl"></i>
                </div>
                <h3 class="text-2xl font-bold mb-2">Click or Drag & Drop Files</h3>
                <p class="text-slate-400 mb-8">Files are processed 100% locally in your browser.</p>
                <input type="file" id="file-input" class="hidden" multiple>
                <button onclick="document.getElementById('file-input').click()" class="bg-cyan-500 hover:bg-cyan-400 px-8 py-3 rounded-xl font-bold transition text-black">
                    Select Files
                </button>
            </div>

            <div id="file-list-container" class="hidden mt-8">
                <h4 class="text-lg font-semibold mb-4">Selected Files</h4>
                <div id="file-list" class="space-y-3 mb-8"></div>
                <div class="flex justify-center">
                    <button id="process-btn" class="w-full md:w-auto bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 px-12 py-4 rounded-2xl font-bold text-lg transition text-black">
                        Process & Download <i class="fas fa-bolt ml-2"></i>
                    </button>
                </div>
            </div>

            <div id="processing-state" class="hidden py-12 text-center">
                <div class="max-w-sm mx-auto space-y-4">
                    <div class="h-6 w-full skeleton mx-auto"></div>
                    <div class="h-6 w-3/4 skeleton mx-auto"></div>
                </div>
                <p class="text-center text-cyan-500 mt-6 animate-pulse font-semibold">Processing your files locally...</p>
            </div>
        </div>
    </main>
    <footer class="py-8 text-center text-slate-600 text-sm">
        &copy; 2026 EduFile Ultra. Professional File Suite.
    </footer>
</body>
</html>
