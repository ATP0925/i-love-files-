<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Love Files</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="tool">
  <h1 id="title"></h1>
  <p id="desc" class="muted"></p>
  <div id="error" class="error" hidden></div>
  <div id="ok" class="ok" hidden></div>
  <div class="box">
    <label class="drop" id="drop">
      <input type="file" id="file">
      <span>Click to choose files, or drop them here</span>
    </label>
    <ul id="list" class="list"></ul>
    <div id="options"></div>
    <button id="run" class="btn" type="button">Start</button>
  </div>
  <p class="muted small">Your files are processed inside your browser and are never uploaded anywhere.</p>
</main>
<script src="js/lib/pdf-lib.min.js"></script>
<script src="js/lib/jszip.min.js"></script>
<script src="js/tools.js"></script>
<script src="js/layout.js"></script>
<script src="js/tool.js"></script>
</body>
</html>
