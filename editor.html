<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Studio | EduFile Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050810; color: #e2e8f0; }
        .cyber-glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #00f2ff, #7000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="cyber-glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-cyan-500/20">
        <a href="index.html" class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-cyan-400 to-blue-600 p-2 rounded-xl">
                <i class="fas fa-bolt text-white text-sm"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter">EduFile <span class="gradient-text">Ultra</span></span>
        </a>
        <a href="index.html" class="text-slate-400 hover:text-white transition text-sm font-medium">
            <i class="fas fa-arrow-left mr-2"></i> Back to Hub
        </a>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-16">
        <div class="text-center mb-12">
            <h1 id="editor-title" class="text-4xl font-extrabold mb-4">Studio Loading...</h1>
            <p id="editor-desc" class="text-slate-400">Prepare your file for professional editing.</p>
        </div>

        <div class="cyber-glass p-8 rounded-3xl shadow-2xl text-center">
            <div id="upload-zone" class="border-2 border-dashed border-cyan-500/30 rounded-2xl p-12 cursor-pointer hover:bg-cyan-500/5 transition">
                <i class="fas fa-cloud-upload-alt text-5xl text-cyan-500 mb-4"></i>
                <h3 class="text-2xl font-bold mb-2">Upload File to Start Editing</h3>
                <p class="text-slate-400 mb-6">Your file stays private and is processed locally.</p>
                <input type="file" id="file-input" class="hidden">
                <button onclick="document.getElementById('file-input').click()" class="bg-cyan-500 text-black px-8 py-3 rounded-xl font-bold hover:bg-cyan-400 transition">
                    Select File
                </button>
            </div>

            <div id="editor-canvas" class="hidden mt-8">
                <div class="bg-slate-900 rounded-2xl p-4 mb-6 flex justify-between items-center">
                    <span class="text-sm font-medium" id="file-name">file.jpg</span>
                    <div class="flex gap-2">
                        <button class="p-2 bg-slate-800 rounded hover:bg-slate-700" title="Crop"><i class="fas fa-crop-alt"></i></button>
                        <button class="p-2 bg-slate-800 rounded hover:bg-slate-700" title="Filter"><i class="fas fa-magic"></i></button>
                        <button class="p-2 bg-slate-800 rounded hover:bg-slate-700" title="Rotate"><i class="fas fa-redo"></i></button>
                    </div>
                </div>
                <div class="w-full h-96 bg-slate-800 rounded-2xl flex items-center justify-center border border-slate-700">
                    <p class="text-slate-500 italic">Editor Canvas Area (Loading Canvas API...)</p>
                </div>
                <div class="mt-8 flex justify-center">
                    <button class="bg-gradient-to-r from-cyan-500 to-blue-600 text-black px-12 py-4 rounded-2xl font-bold text-lg hover:scale-105 transition shadow-xl">
                        Save & Export <i class="fas fa-download ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const titleEl = document.getElementById('editor-title');
            const descEl = document.getElementById('editor-desc');
            
            const types = {
                'image': { title: 'Image Studio', desc: 'Professional Image Editing & Retouching' },
                'pdf': { title: 'PDF Architect', desc: 'Modify, Sign, and Organize PDF Pages' },
                'text': { title: 'Doc Editor', desc: 'Clean and Minimalist Text Editing' }
            };

            const current = types[type] || { title: 'Studio Not Found', desc: 'Please go back to the hub.' };
            titleEl.innerText = current.title;
            descEl.innerText = current.desc;

            const fileInput = document.getElementById('file-input');
            const uploadZone = document.getElementById('upload-zone');
            const canvas = document.getElementById('editor-canvas');

            fileInput.addEventListener('change', () => {
                if(fileInput.files.length > 0) {
                    document.getElementById('file-name').innerText = fileInput.files[0].name;
                    uploadZone.classList.add('hidden');
                    canvas.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
